name: Publish journal
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/publish.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages occasionally stalls in "syncing_files" until the action
      # times out (run 65, 2026-11-10). The build is fine when that happens,
      # so try the same deployment once more before failing the run.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Deploy again after a stalled sync
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # Announce new and changed pages to Bing and the other IndexNow search engines.
      # The script never fails the job; a search engine being down must not fail a deploy.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/indexnow.py
          sparse-checkout-cone-mode: false
      - name: Submit changed pages to IndexNow
        run: python3 tools/indexnow.py
