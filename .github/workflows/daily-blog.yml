name: Daily blog post

on:
  schedule:
    # 21:00 UTC = 06:00 KST (next day) - posts land at 6am Seoul time.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      seed_fixture:
        description: "Run with --seed-fixture (no API calls, for initial deploy)"
        required: false
        default: "false"
      limit:
        description: "Max posts to generate"
        required: false
        default: ""

permissions:
  contents: write
  models: read

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate posts
        env:
          # Free GitHub Models access (preferred). GITHUB_TOKEN is auto-provided
          # by the runner; it has models:read because of the permissions block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Optional fallbacks if you ever want to switch off GitHub Models:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional model override (default: openai/gpt-4o-mini)
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.seed_fixture }}" = "true" ]; then
            ARGS="$ARGS --seed-fixture"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python scripts/generate_posts.py $ARGS

      - name: Commit and push
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +"%Y-%m-%d")
          git commit -m "Daily blog posts: $DATE"
          # Retry push with simple backoff on transient failure.
          for i in 1 2 3 4; do
            if git push origin main; then
              break
            fi
            SLEEP=$((2 ** i))
            echo "push failed; sleeping ${SLEEP}s and retrying"
            sleep $SLEEP
          done
