<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>How to fix the Excel SUMIFS #VALUE! error when criteria ranges differ in size</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to fix the Excel SUMIFS #VALUE! error when criteria</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">ranges differ in size</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-29</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Review the formula shape that causes</text>
<text x="90" y="497" font-size="26" font-weight="600">the error</text>
<text x="90" y="537" font-size="22" fill="#686862">In an example from Microsoft Support, the sum</text>
<text x="90" y="565" font-size="22" fill="#686862">range C2:C10 has 9 rows, while the criteria</text>
<text x="90" y="593" font-size="22" fill="#686862">ranges A2:A12 and B2:B12 each have 11 rows.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Count the rows in each range</text>
<text x="742" y="537" font-size="22" fill="#686862">Write down each range address used in the</text>
<text x="742" y="565" font-size="22" fill="#686862">formula and calculate its number of rows.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Match the sum range to the criteria</text>
<text x="90" y="770" font-size="26" font-weight="600">ranges</text>
<text x="90" y="810" font-size="22" fill="#686862">The solution in Microsoft&#x27;s documentation is to</text>
<text x="90" y="838" font-size="22" fill="#686862">change the sum range to C2:C12 and recalculate</text>
<text x="90" y="866" font-size="22" fill="#686862">the formula.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Distinguish the rules for SUMIF and</text>
<text x="742" y="770" font-size="26" font-weight="600">SUMIFS</text>
<text x="742" y="810" font-size="22" fill="#686862">Microsoft&#x27;s documentation states that the</text>
<text x="742" y="838" font-size="22" fill="#686862">similar SUMIF function can use ranges of</text>
<text x="742" y="866" font-size="22" fill="#686862">different sizes.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
