<text x="90" y="465" font-size="26" font-weight="600">1 What was released?</text>
<text x="90" y="537" font-size="22" fill="#686862">The company identified three released items.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">2 What Lean checking does and does not</text>
<text x="742" y="497" font-size="26" font-weight="600">guarantee</text>
<text x="742" y="537" font-size="22" fill="#686862">Lean checking verifies whether the written proof</text>
<text x="742" y="565" font-size="22" fill="#686862">follows without gaps from the definitions and</text>
<text x="742" y="593" font-size="22" fill="#686862">axioms.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">3 Presentation standards required by</text>
<text x="90" y="770" font-size="26" font-weight="600">the mathematics community</text>
<text x="90" y="810" font-size="22" fill="#686862">OpenAI said it consulted recommendations from</text>
<text x="90" y="838" font-size="22" fill="#686862">the Advisory Group on Mathematics and AI (AGMAI)</text>
<text x="90" y="866" font-size="22" fill="#686862">under the Institute for Advanced Study (IAS).</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">4 Considering funding only as a</text>
<text x="742" y="770" font-size="26" font-weight="600">presentation standard</text>
<text x="742" y="810" font-size="22" fill="#686862">OpenAI said it would donate $5 million to a new</text>
<text x="742" y="838" font-size="22" fill="#686862">initiative by the Simons Foundation.</text>
