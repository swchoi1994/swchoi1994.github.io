<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>What to check when Excel COUNTIF returns 0: spaces, wildcards, and text values</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">What to check when Excel COUNTIF returns 0: spaces,</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">wildcards, and text values</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-31</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check the range and criteria format</text>
<text x="90" y="497" font-size="26" font-weight="600">first</text>
<text x="90" y="537" font-size="22" fill="#686862">COUNTIF uses the syntax =COUNTIF(range,</text>
<text x="90" y="565" font-size="22" fill="#686862">criteria).</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Clean up leading, trailing, and</text>
<text x="742" y="497" font-size="26" font-weight="600">nonprinting characters</text>
<text x="742" y="537" font-size="22" fill="#686862">Microsoft explains that COUNTIF can return</text>
<text x="742" y="565" font-size="22" fill="#686862">unexpected values when text contains leading or</text>
<text x="742" y="593" font-size="22" fill="#686862">trailing spaces or nonprinting characters.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Check wildcard symbols in the value</text>
<text x="90" y="770" font-size="26" font-weight="600">you are searching for</text>
<text x="90" y="810" font-size="22" fill="#686862">In COUNTIF criteria, * means any number of</text>
<text x="90" y="838" font-size="22" fill="#686862">characters, and ? means one character.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Check whether values that look like</text>
<text x="742" y="770" font-size="26" font-weight="600">numbers are text</text>
<text x="742" y="810" font-size="22" fill="#686862">Even if a value appears as a number on screen, a</text>
<text x="742" y="838" font-size="22" fill="#686862">value stored as text may be treated differently</text>
<text x="742" y="866" font-size="22" fill="#686862">from a numeric criterion.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
