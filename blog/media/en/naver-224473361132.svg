<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">What to check when an Ollama model is slow: ollama ps</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">and context length</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-11</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check where the model is loaded with</text>
<text x="90" y="497" font-size="26" font-weight="600">ollama ps</text>
<text x="90" y="537" font-size="22" fill="#686862">After running the model, enter the ollama ps</text>
<text x="90" y="565" font-size="22" fill="#686862">command in the terminal.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Compare the model size with available</text>
<text x="742" y="497" font-size="26" font-weight="600">GPU memory</text>
<text x="742" y="537" font-size="22" fill="#686862">The SIZE shown by ollama ps is the size occupied</text>
<text x="742" y="565" font-size="22" fill="#686862">by the running model.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Check the default context length of</text>
<text x="90" y="770" font-size="26" font-weight="600">4096 tokens</text>
<text x="90" y="810" font-size="22" fill="#686862">The official FAQ states that Ollama uses a</text>
<text x="90" y="838" font-size="22" fill="#686862">default context window of 4096 tokens.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Review the check order all at once</text>
<text x="742" y="810" font-size="22" fill="#686862">1) Check the PROCESSOR value in ollama ps. 2)</text>
<text x="742" y="838" font-size="22" fill="#686862">Compare SIZE with the available GPU memory. 3)</text>
<text x="742" y="866" font-size="22" fill="#686862">Check whether num_ctx or OLLAMA_CONTEXT_LENGTH…</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
