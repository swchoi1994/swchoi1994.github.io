<text x="64" y="172" font-family="Georgia, serif" font-size="42">AI agent chip design benchmark: the gap between working</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">designs and target performance</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-17</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">How is it different from existing</text>
<text x="90" y="497" font-size="26" font-weight="600">benchmarks?</text>
<text x="90" y="537" font-size="22" fill="#686862">Existing benchmarks mostly examine one small</text>
<text x="90" y="565" font-size="22" fill="#686862">step.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Two published figures</text>
<text x="742" y="537" font-size="22" fill="#686862">Even figures released by the same company should</text>
<text x="742" y="565" font-size="22" fill="#686862">not be combined into a single line because the</text>
<text x="742" y="593" font-size="22" fill="#686862">measurement methods differ.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Three practical takeaways</text>
<text x="90" y="810" font-size="22" fill="#686862">First, passing simulation is only an</text>
<text x="90" y="838" font-size="22" fill="#686862">intermediate point.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">What has not yet been confirmed</text>
<text x="742" y="810" font-size="22" fill="#686862">- The number of evaluation tasks, the names of</text>
<text x="742" y="838" font-size="22" fill="#686862">the models tested, and the execution costs have</text>
<text x="742" y="866" font-size="22" fill="#686862">not been confirmed.</text>
