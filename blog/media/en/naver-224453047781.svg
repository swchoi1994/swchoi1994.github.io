<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>How to automatically sort receipt emails with Gmail filters</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to automatically sort receipt emails with Gmail</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">filters</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-25</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Start by noting what receipt emails</text>
<text x="90" y="497" font-size="26" font-weight="600">have in common</text>
<text x="90" y="537" font-size="22" fill="#686862">First note the sender address (from), subject</text>
<text x="90" y="565" font-size="22" fill="#686862">words (subject), and whether there is an</text>
<text x="90" y="593" font-size="22" fill="#686862">attachment (has:attachment).</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Check that the search results contain</text>
<text x="742" y="497" font-size="26" font-weight="600">only the emails you want</text>
<text x="742" y="537" font-size="22" fill="#686862">Open the search options in the Gmail search bar</text>
<text x="742" y="565" font-size="22" fill="#686862">at the top, or enter search operators directly.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Choose the actions in Create filter</text>
<text x="90" y="810" font-size="22" fill="#686862">Click Create filter at the bottom of the search</text>
<text x="90" y="838" font-size="22" fill="#686862">bar, choose Apply the label, and create a new</text>
<text x="90" y="866" font-size="22" fill="#686862">label dedicated to receipts.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Check existing and new emails</text>
<text x="742" y="770" font-size="26" font-weight="600">separately</text>
<text x="742" y="810" font-size="22" fill="#686862">Help explains that filters that forward emails</text>
<text x="742" y="838" font-size="22" fill="#686862">apply only to new emails.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
