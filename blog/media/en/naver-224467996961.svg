<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>How to find the time of an error in Event Viewer when a Windows program suddenly closes</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to find the time of an error in Event Viewer when a</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">Windows program suddenly closes</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-06</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Write down the time it closed first</text>
<text x="90" y="537" font-size="22" fill="#686862">If you do not know the exact time, the search</text>
<text x="90" y="565" font-size="22" fill="#686862">range becomes too broad.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Open Event Viewer and find Windows</text>
<text x="742" y="497" font-size="26" font-weight="600">Logs</text>
<text x="742" y="537" font-size="22" fill="#686862">Search for “Event Viewer” in the Start menu and</text>
<text x="742" y="565" font-size="22" fill="#686862">open it.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Filter the current log by a time range</text>
<text x="90" y="810" font-size="22" fill="#686862">In the “Actions” pane on the right, click</text>
<text x="90" y="838" font-size="22" fill="#686862">“Filter Current Log” and set the time range you</text>
<text x="90" y="866" font-size="22" fill="#686862">noted earlier as the condition.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Read by level: check errors first</text>
<text x="742" y="810" font-size="22" fill="#686862">Events have levels indicating their importance.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
