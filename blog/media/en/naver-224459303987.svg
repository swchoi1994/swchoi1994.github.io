<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>What to Check Before Installing Ollama on Windows and How to Change the Model Storage Location</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">What to Check Before Installing Ollama on Windows and</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">How to Change the Model Storage Location</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-30</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check the Windows version and graphics</text>
<text x="90" y="497" font-size="26" font-weight="600">driver</text>
<text x="90" y="537" font-size="22" fill="#686862">The official documentation requires Windows 10</text>
<text x="90" y="565" font-size="22" fill="#686862">22H2 or later (Home or Pro).</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Check the installation location and</text>
<text x="742" y="497" font-size="26" font-weight="600">administrator privileges</text>
<text x="742" y="537" font-size="22" fill="#686862">OllamaSetup.exe installs to the user account</text>
<text x="742" y="565" font-size="22" fill="#686862">without administrator privileges.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Choose a separate model storage folder</text>
<text x="90" y="810" font-size="22" fill="#686862">Model files can grow from tens of GB to hundreds</text>
<text x="90" y="838" font-size="22" fill="#686862">of GB.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Check the API and log locations after</text>
<text x="742" y="770" font-size="26" font-weight="600">installation</text>
<text x="742" y="810" font-size="22" fill="#686862">When Ollama is running, its API responds at</text>
<text x="742" y="838" font-size="22" fill="#686862">http://localhost:11434.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
