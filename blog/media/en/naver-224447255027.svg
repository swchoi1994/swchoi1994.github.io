<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>Claude Design standalone site to close on December 14: what to check before migrating your design system</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">Claude Design standalone site to close on December 14:</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">what to check before migrating your design system</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-20</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">What changes: new designs will be</text>
<text x="90" y="497" font-size="26" font-weight="600">created as artifacts in Claude</text>
<text x="90" y="537" font-size="22" fill="#686862">According to the Help Center, Claude Design is</text>
<text x="90" y="565" font-size="22" fill="#686862">now in Claude.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Design systems: migration is possible,</text>
<text x="742" y="497" font-size="26" font-weight="600">and the original remains unchanged</text>
<text x="742" y="537" font-size="22" fill="#686862">Design systems can be migrated into Claude.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Projects: there is no automatic</text>
<text x="90" y="770" font-size="26" font-weight="600">migration, so download them yourself</text>
<text x="90" y="810" font-size="22" fill="#686862">Projects are not migrated.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">What team and enterprise</text>
<text x="742" y="770" font-size="26" font-weight="600">administrators should check first</text>
<text x="742" y="810" font-size="22" fill="#686862">Team and Enterprise plans require administrators</text>
<text x="742" y="838" font-size="22" fill="#686862">to check their settings.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
