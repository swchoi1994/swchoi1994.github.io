<text x="90" y="465" font-size="26" font-weight="600">Separate the dates first</text>
<text x="90" y="537" font-size="22" fill="#686862">① November 17, 2026: Gems move to the Gemini</text>
<text x="90" y="565" font-size="22" fill="#686862">app’s settings panel.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Workspace Studio flows may be blocked</text>
<text x="742" y="497" font-size="26" font-weight="600">first</text>
<text x="742" y="537" font-size="22" fill="#686862">Cases involving the “Ask a Gem” step in</text>
<text x="742" y="565" font-size="22" fill="#686862">automation flows are the most urgent.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
