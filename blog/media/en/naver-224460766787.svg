<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>What to check when ##### appears in an Excel cell: column width and negative dates or times</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">What to check when ##### appears in an Excel cell:</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">column width and negative dates or times</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-31</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Adjust the column width first</text>
<text x="90" y="537" font-size="22" fill="#686862">Microsoft explains that ##### may appear when</text>
<text x="90" y="565" font-size="22" fill="#686862">the cell contents are longer than the column</text>
<text x="90" y="593" font-size="22" fill="#686862">width.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Check whether the date or time result</text>
<text x="742" y="497" font-size="26" font-weight="600">is negative</text>
<text x="742" y="537" font-size="22" fill="#686862">If ##### remains even after widening the column,</text>
<text x="742" y="565" font-size="22" fill="#686862">suspect a negative date or time.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Change the result cell to a number</text>
<text x="90" y="770" font-size="26" font-weight="600">format to check the value</text>
<text x="90" y="810" font-size="22" fill="#686862">If a negative result is kept in a date or time</text>
<text x="90" y="838" font-size="22" fill="#686862">format, the actual value is not visible.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Summary of the checking order</text>
<text x="742" y="810" font-size="22" fill="#686862">① Check whether all the cells in the same column</text>
<text x="742" y="838" font-size="22" fill="#686862">show #####.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
