<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to Recover Files from the Google Drive Trash:</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">Restore Deleted Files Within 30 Days</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-07</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Open the Trash first</text>
<text x="90" y="537" font-size="22" fill="#686862">On a computer, go to drive.google.com and click</text>
<text x="90" y="565" font-size="22" fill="#686862">Trash in the left-hand menu.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Select and restore only the files you</text>
<text x="742" y="497" font-size="26" font-weight="600">need</text>
<text x="742" y="537" font-size="22" fill="#686862">Select the file you want to restore and use the</text>
<text x="742" y="565" font-size="22" fill="#686862">restore function.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Distinguish between your files and</text>
<text x="90" y="770" font-size="26" font-weight="600">files shared with you</text>
<text x="90" y="810" font-size="22" fill="#686862">Only the file owner can move a file to the</text>
<text x="90" y="838" font-size="22" fill="#686862">Trash.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Three things to check before permanent</text>
<text x="742" y="770" font-size="26" font-weight="600">deletion</text>
<text x="742" y="810" font-size="22" fill="#686862">First, files in the Trash still use storage</text>
<text x="742" y="838" font-size="22" fill="#686862">space until they are permanently deleted.</text>
