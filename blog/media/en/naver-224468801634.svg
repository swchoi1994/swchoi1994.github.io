<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to freeze panes in Excel so header rows stay visible</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">while scrolling long tables</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-07</text>
