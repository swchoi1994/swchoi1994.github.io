<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Select the reference cell</text>
<text x="90" y="537" font-size="22" fill="#686862">Freeze Panes freezes the rows above and the</text>
<text x="90" y="565" font-size="22" fill="#686862">columns to the left of the selected cell.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Apply Freeze Panes from the View tab</text>
<text x="742" y="537" font-size="22" fill="#686862">On the ribbon, select View &gt; Freeze Panes &gt;</text>
<text x="742" y="565" font-size="22" fill="#686862">Freeze Panes in order.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Example of freezing columns</text>
<text x="90" y="810" font-size="22" fill="#686862">If you want to keep seeing a name or number</text>
<text x="90" y="838" font-size="22" fill="#686862">column while moving across the table to the</text>
<text x="90" y="866" font-size="22" fill="#686862">right, select the column immediately to the…</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
