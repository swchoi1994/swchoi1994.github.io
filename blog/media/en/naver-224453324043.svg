<text x="742" y="537" font-size="22" fill="#686862">Google Business Profile Help explains that</text>
<text x="742" y="565" font-size="22" fill="#686862">special hours are used when business hours</text>
<text x="742" y="593" font-size="22" fill="#686862">temporarily change, such as during the year-end…</text>
