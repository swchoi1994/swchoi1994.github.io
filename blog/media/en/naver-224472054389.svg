<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>How to calculate Gemini API costs: Separate input and output tokens from the pricing effective date</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to calculate Gemini API costs: Separate input and</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">output tokens from the pricing effective date</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-10</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Understand token counts first: 4</text>
<text x="90" y="497" font-size="26" font-weight="600">characters in English, but check…</text>
<text x="90" y="537" font-size="22" fill="#686862">Google’s official documentation explains that</text>
<text x="90" y="565" font-size="22" fill="#686862">one token in Gemini models is approximately 4</text>
<text x="90" y="593" font-size="22" fill="#686862">characters in English, and that 100 tokens…</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Count input tokens with count_tokens</text>
<text x="742" y="497" font-size="26" font-weight="600">before the call</text>
<text x="742" y="537" font-size="22" fill="#686862">A count_tokens call returns the total number of</text>
<text x="742" y="565" font-size="22" fill="#686862">tokens in the request input.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Read output tokens from response usage</text>
<text x="90" y="810" font-size="22" fill="#686862">The response’s usage values include input</text>
<text x="90" y="838" font-size="22" fill="#686862">(total_input_tokens), output</text>
<text x="90" y="866" font-size="22" fill="#686862">(total_output_tokens), thinking…</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Check the pricing period first</text>
<text x="742" y="810" font-size="22" fill="#686862">Even for the same model, the pricing table may</text>
<text x="742" y="838" font-size="22" fill="#686862">include rates for different periods.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
