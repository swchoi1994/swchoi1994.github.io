<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">GitHub to remove three models on November 16—check fixed</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">model settings first</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-18</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check which models need to be changed</text>
<text x="90" y="497" font-size="26" font-weight="600">first</text>
<text x="90" y="537" font-size="22" fill="#686862">GitHub provided the following replacement</text>
<text x="90" y="565" font-size="22" fill="#686862">models.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Have an administrator check the</text>
<text x="742" y="497" font-size="26" font-weight="600">automatic default switch</text>
<text x="742" y="537" font-size="22" fill="#686862">For Enterprise and Business customers, the</text>
<text x="742" y="565" font-size="22" fill="#686862">replacement model will be enabled automatically</text>
<text x="742" y="593" font-size="22" fill="#686862">depending on the default model activation…</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Three-point checklist</text>
<text x="90" y="810" font-size="22" fill="#686862">First, find places where model names are fixed</text>
<text x="90" y="838" font-size="22" fill="#686862">in organization policies and personal settings.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Check model names separately against</text>
<text x="742" y="770" font-size="26" font-weight="600">the API</text>
<text x="742" y="810" font-size="22" fill="#686862">Even if the same model is removed from Copilot,</text>
<text x="742" y="838" font-size="22" fill="#686862">it may remain available through the provider&#x27;s</text>
<text x="742" y="866" font-size="22" fill="#686862">API.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
