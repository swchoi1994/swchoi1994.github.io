<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Conditions to check before</text>
<text x="90" y="497" font-size="26" font-weight="600">installation</text>
<text x="90" y="537" font-size="22" fill="#686862">The requirements listed in the official</text>
<text x="90" y="565" font-size="22" fill="#686862">installation documentation are as follows.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Choose the installation command for</text>
<text x="742" y="497" font-size="26" font-weight="600">your operating system</text>
<text x="742" y="537" font-size="22" fill="#686862">The method recommended in the official</text>
<text x="742" y="565" font-size="22" fill="#686862">documentation is native installation.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Check the version: claude --version</text>
<text x="90" y="810" font-size="22" fill="#686862">After installation is complete, open a new</text>
<text x="90" y="838" font-size="22" fill="#686862">terminal window and enter claude --version.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">First launch and checking the login</text>
<text x="742" y="770" font-size="26" font-weight="600">account</text>
<text x="742" y="810" font-size="22" fill="#686862">When you run claude in a project folder, a login</text>
<text x="742" y="838" font-size="22" fill="#686862">prompt appears.</text>
