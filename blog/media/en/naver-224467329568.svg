<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>How to cancel sent Gmail emails: Set the cancellation time and distinguish scheduled sending</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to cancel sent Gmail emails: Set the cancellation</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">time and distinguish scheduled sending</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-06</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check Undo immediately after sending</text>
<text x="90" y="537" font-size="22" fill="#686862">After you send an email, the message “Message</text>
<text x="90" y="565" font-size="22" fill="#686862">sent” appears in the lower-left corner of the</text>
<text x="90" y="593" font-size="22" fill="#686862">screen, along with the options “Undo” or “View…</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Choose 5, 10, 20, or 30 seconds for</text>
<text x="742" y="497" font-size="26" font-weight="600">the cancellation period</text>
<text x="742" y="537" font-size="22" fill="#686862">Open Gmail in a PC browser, click the Settings</text>
<text x="742" y="565" font-size="22" fill="#686862">icon in the upper-right corner, and select “See</text>
<text x="742" y="593" font-size="22" fill="#686862">all settings.” Next to “Undo Send,” choose 5…</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Example: Sending an email with a typo</text>
<text x="90" y="810" font-size="22" fill="#686862">Here is a hypothetical example.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">What to do after the time has passed</text>
<text x="742" y="810" font-size="22" fill="#686862">An email whose Undo Send period has ended cannot</text>
<text x="742" y="838" font-size="22" fill="#686862">be reversed using this feature.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
