<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>What to check when recent files do not appear in Windows File Explorer: Start with the settings switch</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">What to check when recent files do not appear in Windows</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">File Explorer: Start with the settings switch</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-07</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check the recent files area on File</text>
<text x="90" y="497" font-size="26" font-weight="600">Explorer Home</text>
<text x="90" y="537" font-size="22" fill="#686862">Open File Explorer and select Home.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Turn on the recent items switch in</text>
<text x="742" y="497" font-size="26" font-weight="600">Settings</text>
<text x="742" y="537" font-size="22" fill="#686862">Open Settings and go to Personalization &gt; Start.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Check the privacy setting in File</text>
<text x="90" y="770" font-size="26" font-weight="600">Explorer Options</text>
<text x="90" y="810" font-size="22" fill="#686862">Open Options from the More (...) menu at the top</text>
<text x="90" y="838" font-size="22" fill="#686862">of File Explorer.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">What to check after making changes</text>
<text x="742" y="810" font-size="22" fill="#686862">First, close File Explorer completely and open</text>
<text x="742" y="838" font-size="22" fill="#686862">it again.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
