<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>The order to check app permissions first when Windows microphone audio is not coming through</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">The order to check app permissions first when Windows</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">microphone audio is not coming through</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-23</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Step 1. Check the overall microphone</text>
<text x="90" y="497" font-size="26" font-weight="600">access settings</text>
<text x="90" y="537" font-size="22" fill="#686862">Go to Settings › Privacy &amp; security ›</text>
<text x="90" y="565" font-size="22" fill="#686862">Microphone.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Step 2. Check Store apps and desktop</text>
<text x="742" y="497" font-size="26" font-weight="600">apps separately</text>
<text x="742" y="537" font-size="22" fill="#686862">Apps installed from the Microsoft Store appear</text>
<text x="742" y="565" font-size="22" fill="#686862">individually in the list and can be turned on or</text>
<text x="742" y="593" font-size="22" fill="#686862">off separately.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Step 3. Check the sound with the input</text>
<text x="90" y="770" font-size="26" font-weight="600">device and a recording sample</text>
<text x="90" y="810" font-size="22" fill="#686862">If the permissions are correct, check the device</text>
<text x="90" y="838" font-size="22" fill="#686862">receiving sound.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Step 4. Check the troubleshooter and</text>
<text x="742" y="770" font-size="26" font-weight="600">driver</text>
<text x="742" y="810" font-size="22" fill="#686862">If the first three steps do not solve the</text>
<text x="742" y="838" font-size="22" fill="#686862">problem, run the input device troubleshooter</text>
<text x="742" y="866" font-size="22" fill="#686862">under the Advanced section of Settings › System…</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
