<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img">
<title>How to check allowed settings when an app is blocked by Windows Firewall</title>
<desc>An English guide to the main sections of this article.</desc>
<rect width="1400" height="1050" fill="#f6f4ef"/>
<rect x="64" y="64" width="64" height="5" fill="#a64b2a"/>
<g font-family="Arial, sans-serif" fill="#1e1f23">
<text x="64" y="109" font-size="23" letter-spacing="2" fill="#a64b2a">SEONGWOO CHOI / IT JOURNAL</text>
<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to check allowed settings when an app is blocked by</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">Windows Firewall</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-10-30</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Check whether the firewall is the</text>
<text x="90" y="497" font-size="26" font-weight="600">problem first</text>
<text x="90" y="537" font-size="22" fill="#686862">Not every connection problem is caused by the</text>
<text x="90" y="565" font-size="22" fill="#686862">firewall.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Check the network type in Windows</text>
<text x="742" y="497" font-size="26" font-weight="600">Security</text>
<text x="742" y="537" font-size="22" fill="#686862">Open the Windows Security app and select</text>
<text x="742" y="565" font-size="22" fill="#686862">Firewall &amp; network protection.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Add the app to the allowed list</text>
<text x="90" y="810" font-size="22" fill="#686862">On the Firewall &amp; network protection screen,</text>
<text x="90" y="838" font-size="22" fill="#686862">select Allow an app through firewall.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Check two things if it is still</text>
<text x="742" y="770" font-size="26" font-weight="600">blocked</text>
<text x="742" y="810" font-size="22" fill="#686862">First, check whether the Blocks all incoming</text>
<text x="742" y="838" font-size="22" fill="#686862">connections option is enabled.</text>
<text x="64" y="1010" font-size="21" fill="#686862">AI-assisted article guide. Read the article and linked sources for details.</text></g></svg>
