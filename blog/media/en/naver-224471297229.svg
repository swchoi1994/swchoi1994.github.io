<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">Eligibility: 180 insured-unit days in</text>
<text x="90" y="497" font-size="26" font-weight="600">the past 18 months</text>
<text x="90" y="537" font-size="22" fill="#686862">Job-seeking benefits are considered when, at an</text>
<text x="90" y="565" font-size="22" fill="#686862">employment insurance-covered workplace, the</text>
<text x="90" y="593" font-size="22" fill="#686862">total insured-unit period during the 18 months…</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Calculating the benefit period and</text>
<text x="742" y="497" font-size="26" font-weight="600">prescribed benefit days</text>
<text x="742" y="537" font-size="22" fill="#686862">The benefit period is 12 months from the day</text>
<text x="742" y="565" font-size="22" fill="#686862">after the separation date.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">Application procedure and the 7-day</text>
<text x="90" y="770" font-size="26" font-weight="600">waiting period</text>
<text x="90" y="810" font-size="22" fill="#686862">The basic procedure is to report unemployment</text>
<text x="90" y="838" font-size="22" fill="#686862">without delay after leaving the job to the</text>
<text x="90" y="866" font-size="22" fill="#686862">employment center with jurisdiction over your…</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">Checklist before applying</text>
<text x="742" y="810" font-size="22" fill="#686862">① Check whether the reason for leaving the job</text>
<text x="742" y="838" font-size="22" fill="#686862">constitutes an involuntary separation. ② Add up</text>
<text x="742" y="866" font-size="22" fill="#686862">the insured-unit period over the past 18 months…</text>
