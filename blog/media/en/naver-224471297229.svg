<text x="64" y="172" font-family="Georgia, serif" font-size="42">The order for receiving unemployment benefits: Check the</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">180-day requirement through the 7-day waiting period</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-10</text>
