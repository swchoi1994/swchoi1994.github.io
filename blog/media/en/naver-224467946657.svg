<text x="64" y="172" font-family="Georgia, serif" font-size="42">How to check and organize devices signed in to your</text>
<text x="64" y="221" font-family="Georgia, serif" font-size="42">Google account: Sign out of unknown sessions</text>
<text x="64" y="337" font-size="22" fill="#686862">ARTICLE GUIDE · 2026-11-06</text>
<rect x="64" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="424" font-size="23" fill="#a64b2a">01</text>
<text x="90" y="465" font-size="26" font-weight="600">How to open the device list</text>
<text x="90" y="537" font-size="22" fill="#686862">On a PC browser, open your Google Account</text>
<text x="90" y="565" font-size="22" fill="#686862">settings and select the “Security and sign-in”</text>
<text x="90" y="593" font-size="22" fill="#686862">menu.</text>
<rect x="716" y="382" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="424" font-size="23" fill="#a64b2a">02</text>
<text x="742" y="465" font-size="26" font-weight="600">Three things to read in the list</text>
<text x="742" y="537" font-size="22" fill="#686862">The first is the device name.</text>
<rect x="64" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="90" y="697" font-size="23" fill="#a64b2a">03</text>
<text x="90" y="738" font-size="26" font-weight="600">How to determine whether a device is</text>
<text x="90" y="770" font-size="26" font-weight="600">unfamiliar</text>
<text x="90" y="810" font-size="22" fill="#686862">Let us use a hypothetical example.</text>
<rect x="716" y="655" width="620" height="247" rx="12" fill="#fffdf8" stroke="#d8d4cb"/>
<text x="742" y="697" font-size="23" fill="#a64b2a">04</text>
<text x="742" y="738" font-size="26" font-weight="600">How to sign out and what to watch for</text>
<text x="742" y="810" font-size="22" fill="#686862">Select the device you want to organize and then</text>
<text x="742" y="838" font-size="22" fill="#686862">choose “Sign out.” If multiple sessions appear</text>
<text x="742" y="866" font-size="22" fill="#686862">under the same name, you should sign out of all…</text>
